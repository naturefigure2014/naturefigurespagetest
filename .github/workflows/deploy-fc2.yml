name: Deploy test site to FC2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without uploading"
        type: boolean
        default: true
      connection_test_only:
        description: "Test FTP data connections without building or uploading"
        type: boolean
        default: false
      active_upload_test:
        description: "Upload and verify small files using active and passive FTP"
        type: boolean
        default: false
      action_upload_test:
        description: "Test a small upload using the production FTP action"
        type: boolean
        default: false
      pasv_address_test:
        description: "Compare passive FTP data connection address handling"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fc2-test
  cancel-in-progress: false

jobs:
  connection-check:
    if: ${{ inputs.connection_test_only && !inputs.active_upload_test && !inputs.action_upload_test && !inputs.pasv_address_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Test FTP directory listing
        env:
          FTP_SERVER: ${{ secrets.FC2_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FC2_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FC2_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" || {
            echo "::error::FC2 FTP secrets must be configured."
            exit 1
          }
          status=0
          echo "Testing FTP directory listing with EPSV/PASV negotiation..."
          curl --silent --show-error --fail --connect-timeout 20 --max-time 60 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only \
            "ftp://$FTP_SERVER/test/" --output /dev/null || status=1
          echo "Testing FTP directory listing with PASV only..."
          curl --silent --show-error --fail --connect-timeout 20 --max-time 60 \
            --disable-epsv --user "$FTP_USERNAME:$FTP_PASSWORD" --list-only \
            "ftp://$FTP_SERVER/test/" --output /dev/null || status=1
          exit "$status"

  active-upload-check:
    if: ${{ inputs.active_upload_test && !inputs.action_upload_test && !inputs.pasv_address_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload and verify a small file using active FTP
        env:
          FTP_SERVER: ${{ secrets.FC2_FTP_SERVER_ACTIVE }}
          FTP_USERNAME: ${{ secrets.FC2_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FC2_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" || {
            echo "::error::FC2 active FTP secrets must be configured."
            exit 1
          }
          filename="github-active-ftp-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'GitHub Actions active FTP test: %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ftp-test.txt"
          url="ftp://$FTP_SERVER/test/$filename"
          echo "Uploading test/$filename using active FTP..."
          curl --silent --show-error --fail --connect-timeout 20 --max-time 90 \
            --ftp-port - --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file "$RUNNER_TEMP/ftp-test.txt" "$url"
          echo "Downloading the file to verify its contents..."
          curl --silent --show-error --fail --connect-timeout 20 --max-time 90 \
            --ftp-port - --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "$url" --output "$RUNNER_TEMP/ftp-test-download.txt"
          cmp "$RUNNER_TEMP/ftp-test.txt" "$RUNNER_TEMP/ftp-test-download.txt"
          echo "Active FTP upload and verification succeeded: test/$filename"

  passive-upload-check:
    if: ${{ inputs.active_upload_test && !inputs.action_upload_test && !inputs.pasv_address_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload and verify a small file using passive FTP
        env:
          FTP_SERVER: ${{ secrets.FC2_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FC2_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FC2_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" || {
            echo "::error::FC2 passive FTP secrets must be configured."
            exit 1
          }
          filename="github-passive-ftp-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'GitHub Actions passive FTP test: %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ftp-test.txt"
          url="ftp://$FTP_SERVER/test/$filename"
          echo "Uploading test/$filename using passive FTP..."
          curl --silent --show-error --fail --connect-timeout 20 --max-time 90 \
            --disable-epsv --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file "$RUNNER_TEMP/ftp-test.txt" "$url"
          echo "Downloading the file to verify its contents..."
          curl --silent --show-error --fail --connect-timeout 20 --max-time 90 \
            --disable-epsv --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "$url" --output "$RUNNER_TEMP/ftp-test-download.txt"
          cmp "$RUNNER_TEMP/ftp-test.txt" "$RUNNER_TEMP/ftp-test-download.txt"
          echo "Passive FTP upload and verification succeeded: test/$filename"

  action-upload-check:
    if: ${{ inputs.action_upload_test && !inputs.pasv_address_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare test file
        run: |
          mkdir -p ftp-action-test/_astro
          printf 'GitHub Actions FTP action test: %s\n' "$GITHUB_RUN_ID" > ftp-action-test/_astro/check.txt
      - name: Upload using production FTP action
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FC2_FTP_SERVER }}
          username: ${{ secrets.FC2_FTP_USERNAME }}
          password: ${{ secrets.FC2_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./ftp-action-test/
          server-dir: ./test/ftp-action-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/
          dry-run: false
          log-level: verbose
      - name: Verify test file over HTTP
        run: |
          curl --silent --show-error --fail --max-time 30 \
            "https://ninjaaquarium.web.fc2.com/test/ftp-action-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/_astro/check.txt" \
            --output "$RUNNER_TEMP/ftp-action-check.txt"
          cmp ftp-action-test/_astro/check.txt "$RUNNER_TEMP/ftp-action-check.txt"

  root-upload-check:
    if: ${{ inputs.action_upload_test && !inputs.pasv_address_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare isolated test file
        run: |
          mkdir -p ftp-root-test/_astro
          printf 'GitHub Actions root FTP test: %s\n' "$GITHUB_RUN_ID" > "ftp-root-test/_astro/ftp-root-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
      - name: Upload to actual deployment directory
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FC2_FTP_SERVER }}
          username: ${{ secrets.FC2_FTP_USERNAME }}
          password: ${{ secrets.FC2_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./ftp-root-test/
          server-dir: ./test/
          state-name: .ftp-root-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}.json
          dry-run: false
          log-level: verbose
      - name: Verify test file over HTTP
        run: |
          filename="ftp-root-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          curl --silent --show-error --fail --max-time 30 \
            "https://ninjaaquarium.web.fc2.com/test/_astro/$filename" \
            --output "$RUNNER_TEMP/ftp-root-check.txt"
          cmp "ftp-root-test/_astro/$filename" "$RUNNER_TEMP/ftp-root-check.txt"

  pasv-address-check:
    if: inputs.pasv_address_test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare PASV connection address handling
        env:
          FTP_SERVER: ${{ secrets.FC2_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FC2_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FC2_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" || {
            echo "::error::FC2 FTP secrets must be configured."
            exit 1
          }
          status=0
          for mode in control-ip server-ip; do
            filename="github-pasv-${mode}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            printf 'PASV address test %s %s\n' "$mode" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ftp-pasv-test.txt"
            url="ftp://$FTP_SERVER/test/$filename"
            if [ "$mode" = control-ip ]; then
              address_option=--ftp-skip-pasv-ip
            else
              address_option=--no-ftp-skip-pasv-ip
            fi
            echo "Testing $mode..."
            if curl --silent --show-error --fail --connect-timeout 15 --max-time 45 \
              --disable-epsv "$address_option" --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$RUNNER_TEMP/ftp-pasv-test.txt" "$url" \
              --write-out 'Control connection IP: %{remote_ip}\n'; then
              if curl --silent --show-error --fail --connect-timeout 15 --max-time 45 \
                --disable-epsv "$address_option" --user "$FTP_USERNAME:$FTP_PASSWORD" \
                "$url" --output "$RUNNER_TEMP/ftp-pasv-readback.txt" &&
                cmp "$RUNNER_TEMP/ftp-pasv-test.txt" "$RUNNER_TEMP/ftp-pasv-readback.txt"; then
                echo "$mode upload and readback succeeded: test/$filename"
              else
                echo "::error::$mode readback failed."
                status=1
              fi
            else
              echo "::error::$mode upload failed."
              status=1
            fi
          done
          exit "$status"

  deploy:
    if: ${{ !inputs.connection_test_only && !inputs.active_upload_test && !inputs.action_upload_test && !inputs.pasv_address_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site for FC2
        run: npm run build
        env:
          DEPLOY_TARGET: fc2

      - name: Report deployment size and check file size limit
        run: |
          total=$(du -sb dist | cut -f1)
          echo "Deployment size: $total bytes (existing FC2 files also count towards the quota)."
          if [ "$total" -gt 10000000000 ]; then
            echo "::warning::Deployment exceeds 10 GB, the FC2 paid plan's total storage quota."
          fi
          oversized=$(find dist -type f -size +1000000000c -print)
          if [ -n "$oversized" ]; then
            echo "Files exceeding 1 GB cannot be uploaded to the FC2 paid plan:"
            printf '%s\n' "$oversized"
            exit 1
          fi

      - name: Deploy to FC2 test directory
        id: deploy_first
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FC2_FTP_SERVER }}
          username: ${{ secrets.FC2_FTP_USERNAME }}
          password: ${{ secrets.FC2_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./test/
          dry-run: ${{ inputs.dry_run }}

      - name: Retry deployment
        if: steps.deploy_first.outcome == 'failure'
        id: deploy_second
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FC2_FTP_SERVER }}
          username: ${{ secrets.FC2_FTP_USERNAME }}
          password: ${{ secrets.FC2_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./test/
          dry-run: ${{ inputs.dry_run }}

      - name: Final deployment retry
        if: steps.deploy_second.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FC2_FTP_SERVER }}
          username: ${{ secrets.FC2_FTP_USERNAME }}
          password: ${{ secrets.FC2_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./test/
          dry-run: ${{ inputs.dry_run }}
