name: Deploy test site to FC2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without uploading"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fc2-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site for FC2
        run: npm run build
        env:
          DEPLOY_TARGET: fc2

      - name: Report deployment size and check file size limit
        run: |
          total=$(du -sb dist | cut -f1)
          echo "Deployment size: $total bytes (existing FC2 files also count towards the quota)."
          if [ "$total" -gt 10000000000 ]; then
            echo "::warning::Deployment exceeds 10 GB, the FC2 paid plan's total storage quota."
          fi
          oversized=$(find dist -type f -size +1000000000c -print)
          if [ -n "$oversized" ]; then
            echo "Files exceeding 1 GB cannot be uploaded to the FC2 paid plan:"
            printf '%s\n' "$oversized"
            exit 1
          fi

      - name: Deploy to FC2 test directory
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FC2_FTP_SERVER }}
          username: ${{ secrets.FC2_FTP_USERNAME }}
          password: ${{ secrets.FC2_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./test/
          dry-run: ${{ inputs.dry_run }}
